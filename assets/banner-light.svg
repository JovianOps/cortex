<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Cortex — Modular Skills for Hermes Agent</title>
  <desc id="desc">JovianOps/cortex: 10 core skills and 10 extended engineering skills for Hermes Agent across Linux, macOS, and Windows.</desc>
  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#D5D2C7" />
    </pattern>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8421B" />
      <stop offset="65%" stop-color="#D46A43" />
      <stop offset="100%" stop-color="#DFDDD4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fade-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6F5F0" stop-opacity="1" />
      <stop offset="55%" stop-color="#F6F5F0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#F6F5F0" stop-opacity="0" />
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="1198" height="318" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Background -->
    <rect x="0" y="0" width="1200" height="320" fill="#F6F5F0" />

    <!-- Subtle Dot Grid on Right Half -->
    <rect x="520" y="0" width="680" height="320" fill="url(#dot-grid)" opacity="0.85" />
    <rect x="520" y="0" width="260" height="320" fill="url(#fade-right)" />

    <!-- Top Terracotta Accent Rule -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent-line)" />

    <!-- Left Content Block -->
    <g transform="translate(56, 48)">
      <!-- Eyebrow -->
      <circle cx="5" cy="6" r="4" fill="#B8421B" />
      <text x="18" y="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
        <tspan fill="#5C5A52" font-weight="600" letter-spacing="1.2">JOVIANOPS / CORTEX</tspan>
        <tspan fill="#848177" letter-spacing="0.6">  ·  HERMES AGENT SKILL TAP</tspan>
      </text>

      <!-- Logo Mark + Title -->
      <g transform="translate(0, 34)">
        <rect x="0" y="4" width="52" height="52" rx="11" fill="#161614" />
        <rect x="2" y="6" width="48" height="48" rx="9" fill="none" stroke="#B8421B" stroke-width="1.5" opacity="0.45" />
        <path d="M16 18H36V25H23V35H36V42H16V18Z" fill="#F6F5F0" />
        <rect x="30" y="27.5" width="6" height="5" rx="1" fill="#E26D43" />

        <text x="70" y="49" fill="#161614" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.6">Cortex</text>
      </g>

      <!-- Tagline -->
      <text x="0" y="132" fill="#5C5A52" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Modular, deterministic skills for Hermes Agent —</text>
      <text x="0" y="158" fill="#5C5A52" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400">built for coding, validation, DevOps, and research.</text>

      <!-- Metadata Pills -->
      <g transform="translate(0, 190)">
        <!-- Core Pill -->
        <rect x="0" y="0" width="128" height="30" rx="7" fill="#EBE9E1" stroke="#DFDDD4" stroke-width="1" />
        <text x="64" y="19" text-anchor="middle" fill="#2C2B28" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">10 Core Skills</text>

        <!-- Extended Pill -->
        <rect x="138" y="0" width="154" height="30" rx="7" fill="#F9EAE4" stroke="#EBC8BA" stroke-width="1" />
        <text x="215" y="19" text-anchor="middle" fill="#993514" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">10 Extended Skills</text>

        <!-- Cross-platform Pill -->
        <rect x="302" y="0" width="156" height="30" rx="7" fill="#FFFFFF" stroke="#DFDDD4" stroke-width="1" />
        <text x="380" y="19" text-anchor="middle" fill="#5C5A52" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500">Bash &amp; PowerShell</text>

        <!-- License Pill -->
        <rect x="468" y="0" width="70" height="30" rx="7" fill="#FFFFFF" stroke="#DFDDD4" stroke-width="1" />
        <text x="503" y="19" text-anchor="middle" fill="#5C5A52" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500">MIT</text>
      </g>
    </g>

    <!-- Right Terminal Preview Card -->
    <g transform="translate(658, 44)">
      <!-- Subtle Card Shadow -->
      <rect x="4" y="8" width="486" height="232" rx="12" fill="#161614" opacity="0.08" />
      <!-- Terminal Container -->
      <rect x="0" y="0" width="486" height="232" rx="12" fill="#171715" stroke="#2D2D29" stroke-width="1" />
      <!-- Terminal Titlebar -->
      <rect x="0" y="0" width="486" height="36" rx="12" fill="#20201D" />
      <rect x="0" y="24" width="486" height="12" fill="#20201D" />
      <line x1="0" y1="36" x2="486" y2="36" stroke="#2D2D29" stroke-width="1" />
      <!-- Window Dots -->
      <circle cx="20" cy="18" r="5" fill="#4A4943" />
      <circle cx="36" cy="18" r="5" fill="#4A4943" />
      <circle cx="52" cy="18" r="5" fill="#4A4943" />
      <text x="243" y="22" text-anchor="middle" fill="#8C8A80" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">quick-install — hermes</text>

      <!-- Terminal Lines -->
      <g transform="translate(22, 64)" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">
        <text x="0" y="0" fill="#E26D43">$</text>
        <text x="16" y="0" fill="#ECEBE4">hermes skills tap add JovianOps/cortex</text>

        <text x="0" y="26" fill="#7CC494">✓</text>
        <text x="16" y="26" fill="#9C9A90">Tap added · 10 core + 10 extended skills</text>

        <text x="0" y="64" fill="#E26D43">$</text>
        <text x="16" y="64" fill="#ECEBE4">hermes skills install \</text>
        <text x="24" y="84" fill="#D5D2C7">JovianOps/cortex/skills/academic-assistant</text>

        <text x="0" y="114" fill="#7CC494">✓</text>
        <text x="16" y="114" fill="#9C9A90">Ready on Linux, macOS &amp; Windows</text>

        <!-- Prompt cursor -->
        <text x="0" y="144" fill="#E26D43">$</text>
        <rect x="16" y="132" width="8" height="15" rx="1.5" fill="#E26D43" opacity="0.85" />
      </g>
    </g>
  </g>

  <!-- Outer Crisp Border -->
  <rect x="1" y="1" width="1198" height="318" rx="16" fill="none" stroke="#DFDDD4" stroke-width="1.5" />
</svg>
