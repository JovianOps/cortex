name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate Skills (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pyyaml ruff

      - name: Check Python syntax and lint rules
        run: |
          python -m compileall -q -f scripts skills premium-skills tests
          ruff check --select E9,F scripts skills premium-skills tests

      - name: Validate all YAML files (including workflows)
        run: python scripts/validate_yaml.py

      - name: Validate all SKILL.md files and ZIP distributions
        run: python scripts/validate_skills.py

      - name: Verify ZIP archives and SHA-256 checksums
        run: python scripts/package_skills.py --check

      - name: Validate multi-agent plugin & extension manifests
        run: python scripts/validate_manifests.py

      - name: Audit skill quality & validate 24-task eval suite
        run: python scripts/eval_skills.py

      - name: Run automated test suite
        run: python -m unittest discover -s tests -v

      - name: Run Cortex CLI doctor smoke check
        run: python scripts/cortex.py doctor

  cross-platform-cli:
    name: Cross-Platform CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run unit tests and CLI verification on ${{ matrix.os }}
        run: |
          python -m unittest discover -s tests -v
          python scripts/cortex.py --version
          python scripts/cortex.py info security-auditor --json
          python scripts/cortex.py verify --json

  validate-web-and-docs:
    name: Validate Web & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify Node CLI launcher syntax
        run: node --check bin/cortex.mjs

      - name: Verify index.html JS, checksums/packs parity, and WCAG 2.2 AA
        run: python scripts/verify_site.py

      - name: Check README.md local links and heading anchors
        run: python skills/documentation-generator/scripts/check_docs.py README.md

  package-smoke-test:
    name: npm Package Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Pack @jovianops/cortex and test installed CLI in isolation
        run: |
          TARBALL=$(npm pack --silent)
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR" "$TARBALL"' EXIT
          npm --prefix "$TMPDIR" install --no-save "./$TARBALL"
          (
            cd "$TMPDIR"
            ./node_modules/.bin/cortex detect
            ./node_modules/.bin/cortex doctor
            ./node_modules/.bin/cortex packs
            ./node_modules/.bin/cortex search --has-script
            ./node_modules/.bin/cortex audit
            ./node_modules/.bin/cortex install --agent claude-code --pack fullstack --scope project
            test -f "$TMPDIR/.claude/skills/security-auditor/scripts/secret_scan.py"
          )

  security-and-workflows:
    name: Security & Workflow Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Audit GitHub Actions workflows (Cortex lint_actions.py)
        run: python premium-skills/devops-pipeline/scripts/lint_actions.py .github/workflows

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  release:
    name: Release
    needs:
      - validate-skills
      - cross-platform-cli
      - validate-web-and-docs
      - package-smoke-test
      - security-and-workflows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
