name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    name: Validate Skills
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install validation deps
        run: |
          pip install pyyaml ruff
      
      - name: Validate all SKILL.md files
        run: |
          python -c "
import yaml, sys, os, glob

errors = []
warnings = []

for skill_file in glob.glob('skills/**/SKILL.md', recursive=True):
    print(f'Checking {skill_file}...')
    try:
        with open(skill_file, 'r') as f:
            content = f.read()
        
        if not content.startswith('---'):
            errors.append(f'{skill_file}: Missing frontmatter (must start with ---)')
            continue
            
        parts = content.split('---', 2)
        if len(parts) < 3:
            errors.append(f'{skill_file}: Invalid frontmatter structure')
            continue
            
        fm = yaml.safe_load(parts[1])
        
        # Required fields
        required = ['name', 'description', 'version', 'author', 'license', 'platforms', 'metadata']
        for field in ['name', 'description', 'version', 'author', 'license', 'platforms']:
            if field not in fm:
                errors.append(f'{skill_file}: Missing required field: {field}')
        
        if 'metadata' in fm and 'hermes' in fm['metadata']:
            hermes = fm['metadata']['hermes']
            if 'tags' not in hermes:
                warnings.append(f'{skill_file}: Missing hermes.tags')
            if 'related_skills' not in fm['metadata']['hermes']:
                warnings.append(f'{skill_file}: Missing hermes.related_skills')
        
        # Description length check
        if 'description' in fm and len(fm['description']) > 60:
            warnings.append(f'{skill_file}: Description > 60 chars ({len(fm["description"])} chars)')
        
        if 'description' in fm and not fm['description'].endswith('.'):
            warnings.append(f'{skill_file}: Description should end with period')
        
        # Check platforms
        valid_platforms = {'linux', 'macos', 'windows'}
        if 'platforms' in fm:
            for p in fm['platforms']:
                if p not in valid_platforms:
                    warnings.append(f'{skill_file}: Unknown platform: {p}')
        
    except yaml.YAMLError as e:
        errors.append(f'{skill_file}: Invalid YAML: {e}')
    except Exception as e:
        errors.append(f'{skill_file}: {e}')

if warnings:
    for w in warnings:
        print(f'::warning file={skill_file}::{w}')

if errors:
    for e in errors:
        print(f'::error::{e}')
    sys.exit(1)

print('All SKILL.md files validated successfully!')
"
      
      - name: Check for empty skill directories
        run: |
          for dir in skills/*/; do
            if [ ! -f "$dir/SKILL.md" ]; then
              echo "::error::$dir: Missing SKILL.md"
              exit 1
            fi
          done
        echo "All skill directories have SKILL.md"

  validate-scripts:
    name: Validate Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run Python script syntax checks
        run: |
          python -m py_compile scripts/*.py 2>/dev/null || true
          find . -name "*.py" -exec python -m py_compile {} \;

  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      
      - name: Lint markdown files
        run: markdownlint '**/*.md' --config .markdownlint.json || true

  validate-yaml:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate YAML files
        run: |
          pip install pyyaml
          python -c "
import yaml, sys, glob, os
errors = []
for yaml_file in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
    try:
        with open(yaml_file, 'r') as f:
            yaml.safe_load(f)
    except yaml.YAMLError as e:
        errors.append(f'{yaml_file}: {e}')
if errors:
    for e in errors:
        print(f'::error::{e}')
    sys.exit(1)
  print('All YAML files valid')
"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          ignore-unfixed: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
      
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/ci
          generate-sarif: true
          sarif-output: semgrep-results.sarif
      
      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
