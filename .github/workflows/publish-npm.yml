name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run validation and npm pack smoke test without publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify & Publish @jovianops/cortex
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 24 ships npm 11.5+ required for Trusted Publishing)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python validation dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Run full Cortex test & integrity suite
        run: npm test

      - name: Verify npm tarball installs and runs cleanly in an isolated directory
        run: |
          TARBALL=$(npm pack --silent)
          TMPDIR=$(mktemp -d)
          npm --prefix "$TMPDIR" install --no-save "./$TARBALL"
          (
            cd "$TMPDIR"
            ./node_modules/.bin/cortex detect
            ./node_modules/.bin/cortex doctor
            ./node_modules/.bin/cortex packs
            ./node_modules/.bin/cortex search --has-script
            ./node_modules/.bin/cortex audit
            ./node_modules/.bin/cortex install --agent claude-code --pack fullstack --scope project
            test -f "$TMPDIR/.claude/skills/security-auditor/scripts/secret_scan.py"
          )
          rm -rf "$TMPDIR" "$TARBALL"

      - name: Verify package.json version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish @jovianops/cortex to npm (OIDC Trusted Publishing or initial NPM_TOKEN)
        if: ${{ inputs.dry_run != true }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with NPM_TOKEN secret (initial bootstrap publish)..."
            npm config set "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          else
            echo "Publishing with npm Trusted Publishing (OIDC, tokenless)..."
          fi
          npm publish --provenance --access public
