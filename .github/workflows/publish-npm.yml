name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run validation and npm pack smoke test without publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify & Publish @jovianops/cortex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (Node 24 ships npm 11.5+ required for Trusted Publishing)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python validation dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Run full Cortex test & integrity suite
        run: npm test

      - name: Verify npm tarball installs and runs cleanly in an isolated directory
        run: |
          TARBALL=$(npm pack --silent)
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR" "$TARBALL"' EXIT
          npm --prefix "$TMPDIR" install --no-save "./$TARBALL"
          (
            cd "$TMPDIR"
            ./node_modules/.bin/cortex detect
            ./node_modules/.bin/cortex doctor
            ./node_modules/.bin/cortex packs
            ./node_modules/.bin/cortex search --has-script
            ./node_modules/.bin/cortex audit
            ./node_modules/.bin/cortex install --agent claude-code --pack fullstack --scope project
            test -f "$TMPDIR/.claude/skills/security-auditor/scripts/secret_scan.py"
          )

      - name: Verify package.json version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish @jovianops/cortex to npm (OIDC Trusted Publishing or initial NPM_TOKEN)
        if: ${{ inputs.dry_run != true }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with NPM_TOKEN secret (initial bootstrap publish)..."
            npm config set "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          else
            echo "Publishing with npm Trusted Publishing (OIDC, tokenless)..."
          fi
          npm publish --provenance --access public

      - name: Record published tarball SHA-256 & SRI integrity in job summary
        if: ${{ inputs.dry_run != true }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TARBALL_URL="https://registry.npmjs.org/@jovianops/cortex/-/cortex-${PKG_VERSION}.tgz"
          DOWNLOADED=false
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$TARBALL_URL" -o "cortex-${PKG_VERSION}.tgz"; then
              DOWNLOADED=true
              break
            fi
            echo "Attempt ${attempt}/5: tarball not yet public at ${TARBALL_URL}; waiting 5s..."
            sleep 5
          done

          if [ "$DOWNLOADED" = "true" ]; then
            SHA256=$(sha256sum "cortex-${PKG_VERSION}.tgz" | awk '{print $1}')
            SRI=$(npm view "@jovianops/cortex@${PKG_VERSION}" dist.integrity || echo "pending")
            {
              echo "## Published \`@jovianops/cortex@${PKG_VERSION}\` Checksums"
              echo ""
              echo "| Artifact | Algorithm | Fingerprint |"
              echo "| :--- | :--- | :--- |"
              echo "| \`cortex-${PKG_VERSION}.tgz\` | SHA-256 | \`${SHA256}\` |"
              echo "| \`cortex-${PKG_VERSION}.tgz\` | SHA-512 (SRI) | \`${SRI}\` |"
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "cortex-${PKG_VERSION}.tgz"
          else
            echo "::notice::@jovianops/cortex@${PKG_VERSION} publish succeeded, but the public tarball is not yet live (404). If npm Staged Publishing is enabled on @jovianops/cortex, approve the staged release on npmjs.com."
            {
              echo "## \`@jovianops/cortex@${PKG_VERSION}\` Published (Pending Public Availability)"
              echo ""
              echo "\`npm publish\` succeeded, but \`${TARBALL_URL}\` returned HTTP 404 after 5 attempts."
              echo "If **npm Staged Publishing** is enabled for \`@jovianops/cortex\`, approve the staged version in npmjs.com to make it public."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
