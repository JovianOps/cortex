name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and pack only, without publishing to npm"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PKG_NAME: "@jovianops/cortex"

jobs:
  publish:
    name: Verify & Publish @jovianops/cortex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (Node 24 ships npm 11.5+ required for Trusted Publishing)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python validation dependencies
        run: python -m pip install --upgrade pip pyyaml ruff

      - name: Verify toolchain supports npm Trusted Publishing
        run: |
          set -euo pipefail
          npm --version
          npm --version | node -e '
            const required = [11, 5, 1];
            const actual = require("node:fs").readFileSync(0, "utf8").trim().split(".").map(Number);
            for (let i = 0; i < required.length; i += 1) {
              if (actual[i] > required[i]) process.exit(0);
              if (actual[i] < required[i]) {
                console.error(`::error::npm ${actual.join(".")} is too old for Trusted Publishing (requires >= 11.5.1).`);
                process.exit(1);
              }
            }
          '

      - name: Resolve release metadata (tag, version, dist-tag, skip reason)
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"

          SKIP_REASON=""

          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$REF_NAME"
            if [[ "$TAG" =~ ^[vV]?([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)*)$ ]]; then
              TAG_VERSION="${BASH_REMATCH[1]}"
              if [[ "$TAG_VERSION" != "$VERSION" ]]; then
                echo "::error::Release tag ($TAG) does not match package.json version ($VERSION)"
                exit 1
              fi
            else
              SKIP_REASON="Release tag '$TAG' is not a SemVer version tag, so this release is not an npm package release."
            fi
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
            if [[ "$TAG" =~ ^[vV]?([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)*)$ ]]; then
              TAG_VERSION="${BASH_REMATCH[1]}"
              if [[ "$TAG_VERSION" != "$VERSION" ]]; then
                echo "::error::Dispatching from tag ($TAG) does not match package.json version ($VERSION)"
                exit 1
              fi
            else
              SKIP_REASON="Dispatching from tag '$TAG' which is not a SemVer version tag."
            fi
          elif [[ "$REF_NAME" != "main" ]]; then
            echo "::error::Manual npm publishes must run from main (got '$REF_NAME'). Re-run this workflow on the main branch."
            exit 1
          fi

          if [[ -z "$SKIP_REASON" ]] && npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            SKIP_REASON="${PKG_NAME}@${VERSION} is already published on npm; nothing to publish."
          fi

          if [[ -n "$SKIP_REASON" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            SKIP_REASON="Dry run requested; validation and pack smoke test only."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

          echo "skip_reason=${SKIP_REASON}" >> "$GITHUB_OUTPUT"

          if [[ -z "$SKIP_REASON" ]]; then
            DECISION="yes"
          else
            DECISION="no"
          fi

          {
            echo "## npm publish plan"
            echo ""
            echo "- Package: \`${PKG_NAME}@${VERSION}\`"
            echo "- Dist-tag: \`${DIST_TAG}\`"
            echo "- Will publish: ${DECISION}"
            echo "- Trigger: \`${EVENT_NAME}\` on \`${REF_NAME}\`"
            if [[ -n "$SKIP_REASON" ]]; then
              echo "- Reason: ${SKIP_REASON}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run full Cortex test & integrity suite
        run: |
          python -m compileall -q -f scripts skills premium-skills tests
          ruff check --select E9,F scripts skills premium-skills tests
          npm test

      - name: Verify npm tarball installs and runs cleanly in an isolated directory
        run: |
          TARBALL=$(npm pack --silent)
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR" "$TARBALL"' EXIT
          npm --prefix "$TMPDIR" install --no-save "./$TARBALL"
          (
            cd "$TMPDIR"
            ./node_modules/.bin/cortex detect
            ./node_modules/.bin/cortex doctor --json
            ./node_modules/.bin/cortex packs
            ./node_modules/.bin/cortex search --has-script
            ./node_modules/.bin/cortex audit --json
            ./node_modules/.bin/cortex scan . --json --only secrets
            ./node_modules/.bin/cortex install --agent claude-code --pack fullstack --scope project
            test -f "$TMPDIR/.claude/skills/security-auditor/scripts/secret_scan.py"
          )

      - name: Publish @jovianops/cortex to npm (OIDC Trusted Publishing or initial NPM_TOKEN)
        if: steps.meta.outputs.should_publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing with the NPM_TOKEN secret (bootstrap token mode)..."
            npm config set "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          else
            echo "Publishing with npm Trusted Publishing (OIDC, tokenless)..."
          fi
          npm publish --provenance --access public --tag "$DIST_TAG"
          echo "Published ${PKG_NAME}@${VERSION} under dist-tag '${DIST_TAG}'."

      - name: Record published tarball SHA-256 & SRI integrity in job summary
        if: steps.meta.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          TARBALL_URL="https://registry.npmjs.org/@jovianops/cortex/-/cortex-${VERSION}.tgz"
          DOWNLOADED=false
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$TARBALL_URL" -o "cortex-${VERSION}.tgz"; then
              DOWNLOADED=true
              break
            fi
            echo "Attempt ${attempt}/5: tarball not yet public at ${TARBALL_URL}; waiting 5s..."
            sleep 5
          done

          if [ "$DOWNLOADED" = "true" ]; then
            SHA256=$(sha256sum "cortex-${VERSION}.tgz" | awk '{print $1}')
            SRI=$(npm view "@jovianops/cortex@${VERSION}" dist.integrity || echo "pending")
            {
              echo "## Published \`@jovianops/cortex@${VERSION}\` Checksums"
              echo ""
              echo "| Artifact | Algorithm | Fingerprint |"
              echo "| :--- | :--- | :--- |"
              echo "| \`cortex-${VERSION}.tgz\` | SHA-256 | \`${SHA256}\` |"
              echo "| \`cortex-${VERSION}.tgz\` | SHA-512 (SRI) | \`${SRI}\` |"
              echo ""
              echo "Install with: \`npm install @jovianops/cortex@${DIST_TAG}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "cortex-${VERSION}.tgz"
          else
            echo "::notice::@jovianops/cortex@${VERSION} publish succeeded, but the public tarball is not yet live (404). If npm Staged Publishing is enabled on @jovianops/cortex, approve the staged release on npmjs.com."
            {
              echo "## \`@jovianops/cortex@${VERSION}\` Published (Pending Public Availability)"
              echo ""
              echo "\`npm publish\` succeeded, but \`${TARBALL_URL}\` returned HTTP 404 after 5 attempts."
              echo "If **npm Staged Publishing** is enabled for \`@jovianops/cortex\`, approve the staged version in npmjs.com to make it public."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report skipped publish
        if: steps.meta.outputs.should_publish != 'true'
        env:
          SKIP_REASON: ${{ steps.meta.outputs.skip_reason }}
        run: |
          echo "::notice::npm publish skipped: ${SKIP_REASON}"
          {
            echo "## npm publish skipped"
            echo ""
            echo "${SKIP_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"
