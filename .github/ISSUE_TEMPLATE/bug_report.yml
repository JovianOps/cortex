name: Bug Report
description: Report a bug in a Cortex skill, CLI command, installer, or website.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npx @jovianops/cortex ...`
        2. Observe error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (OS, Python, Node, Agent/IDE)
      placeholder: "e.g., Windows 11, Python 3.12, Node 24, VS Code 1.109"
    validations:
      required: true
