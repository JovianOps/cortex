name: New Skill Proposal
description: Propose a new modular SKILL.md playbook and bundled deterministic helper script.
title: "[Skill]: "
labels: ["enhancement"]
body:
  - type: input
    id: slug
    attributes:
      label: Proposed skill slug
      placeholder: "e.g., graphql-auditor"
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Collection tier
      options:
        - core (skills/)
        - extended (premium-skills/)
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Problem, stop gates, and bundled helper script
      description: What deterministic checks should the bundled Python helper script perform?
    validations:
      required: true
